<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <!-- 內容安全政策（CSP）：只允許從這些地方載入程式和連線；就算哪裡忘了跳脫 HTML，混進來的程式也不會執行。
       script：自己的檔案、Firebase SDK（gstatic）、Google 登入用的腳本（apis.google.com）
       connect：Gemini、Firebase 登入與 Firestore 都在 *.googleapis.com；英文解釋備援是 Free Dictionary
       frame：Firebase 登入用的隱藏 iframe（authDomain）　說明見 docs/decisions.md -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://api.dictionaryapi.dev; frame-src https://toeic-cards.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>多益字卡 TOEIC Cards</title>
  <meta name="description" content="只要輸入英文單字，自動產生中文、英文解釋與多益例句的背單字網站">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iPhone「加入主畫面」後用全螢幕 App 的樣子開啟 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="多益字卡">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=reading-1">
  <!-- 在畫面出現前套用主題（一般 script，不是 module，才會在畫面出現前執行）-->
  <script src="js/theme-init.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/review">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span class="brand-text">多益字卡</span>
    </a>
    <nav class="nav" aria-label="主要功能">
      <div class="review-nav" id="reviewNav"><a href="#/review" data-route="review">複習<span class="nav-badge" id="reviewBadge" hidden></span></a><button id="reviewMenuToggle" type="button" aria-label="選擇複習方式" aria-expanded="false" aria-controls="reviewChoices">▾</button>
        <div class="review-choices" id="reviewChoices" hidden><a href="#/review">今日複習<small>依排程回想與評分</small></a><a href="#/free">自由翻卡<small>翻閱目前單字集的所有字</small></a></div></div>
      <a href="#/cards" data-route="cards">探索</a>
      <a href="#/quiz" data-route="quiz">測驗</a>
      <a href="#/words" data-route="words">單字庫</a>
      <a href="#/stats" data-route="stats">統計</a>
    </nav>
    <button class="nav-lookup" id="openLookup" type="button" aria-label="查單字" title="查單字（Ctrl / ⌘ K）">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>查單字</span>
    </button>
    <a class="icon-btn settings-link" href="#/settings" data-route="settings" aria-label="設定" title="設定">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </a>
    <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切換深色模式" title="切換深色模式">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div id="offlineBar" class="offline-bar" role="status" hidden>
    目前離線中：複習、探索、簡易測驗照常可用；AI 生成和新的 Part 5 題目要等連上網路
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="editDialog" class="dialog">
    <form method="dialog" id="editForm">
      <h2 class="dialog-title">編輯單字</h2>
      <label class="field">
        <span>英文單字</span>
        <input name="word" required autocomplete="off" spellcheck="false">
      </label>
      <div class="field-row">
        <label class="field field-narrow">
          <span>詞性</span>
          <input name="pos" placeholder="例如 v. / n." autocomplete="off">
        </label>
        <label class="field">
          <span>中文意思（多個詞性可分行）</span>
          <textarea name="zh" rows="2" placeholder="v. 核准；批准"></textarea>
        </label>
      </div>
      <label class="field">
        <span>英文解釋</span>
        <textarea name="en" rows="2" placeholder="用淺白的英文說明這個字"></textarea>
      </label>
      <label class="field">
        <span>例句（一行一句；中文翻譯接在 <code>|</code> 後面）</span>
        <textarea name="examples" rows="3" placeholder="The manager approved the budget. | 經理核准了預算。"></textarea>
      </label>
      <div class="field-row">
        <label class="field">
          <span>常見搭配詞（逗號分隔）</span>
          <input name="collocations" placeholder="approve a request, approve a plan" autocomplete="off">
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>詞性變化（逗號分隔）</span>
          <input name="forms" placeholder="approval (n.), approved (adj.)" autocomplete="off">
        </label>
        <label class="field">
          <span>同義詞（逗號分隔）</span>
          <input name="synonyms" placeholder="authorize, endorse" autocomplete="off">
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" value="cancel" id="editCancel">取消</button>
        <button type="submit" class="btn btn-primary" value="save">儲存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js?v=reading-1"></script>
</body>
</html>
